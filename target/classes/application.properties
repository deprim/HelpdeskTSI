spring.application.name=HelpdeskTSI

rsa.private-key=${RSA_PRIVATE_KEY}
rsa.public-key=${RSA_PUBLIC_KEY}


spring.datasource.url=jdbc:postgresql://postgres-db-deprim-project.d.aivencloud.com:22271/helpdesk?sslmode=require
spring.datasource.username=avnadmin
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver


spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=none

spring.liquibase.enabled=false
spring.liquibase.change-log=classpath:db/db.changelog-master.yaml

#spring.ai.mistralai.api-key=${API_KEY}

# The URL where Ollama is listening (default is 11434)
spring.ai.ollama.base-url=http://localhost:11434

spring.ai.ollama.chat.options.model=llama3
spring.ai.ollama.chat.options.temperature=0.7

