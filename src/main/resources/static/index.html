<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TSI Helpdesk</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            color: #333;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 700px;
            background: #fff;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        h1 { margin-top: 0; font-size: 24px; color: #0056b3; text-align: center; }

        .auth-tabs, .main-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .tab-btn {
            flex: 1;
            padding: 12px;
            background: #f8f9fa;
            border: 1px solid #ccc;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
        }

        .tab-btn.active {
            background: #0056b3;
            color: white;
            border-color: #0056b3;
        }

        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; font-size: 14px; }
        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }

        .submit-btn {
            width: 100%;
            padding: 12px;
            background: #0056b3;
            color: white;
            border: none;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
        }

        .chat-topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #eee;
            padding-bottom: 10px;
            margin-bottom: 15px;
        }

        .messages-area {
            height: 400px;
            overflow-y: auto;
            border: 1px solid #eee;
            border-radius: 4px;
            padding: 15px;
            background: #fdfdfd;
            margin-bottom: 15px;
        }

        .msg { margin-bottom: 15px; display: flex; flex-direction: column; }
        .msg.user { align-items: flex-end; }
        .msg.bot { align-items: flex-start; }

        .msg-bubble {
            padding: 10px 15px;
            border-radius: 15px;
            max-width: 85%;
            word-wrap: break-word;
            font-size: 15px;
            line-height: 1.4;
        }

        .msg.user .msg-bubble { background: #0056b3; color: white; border-bottom-right-radius: 2px; }
        .msg.bot .msg-bubble { background: #e9e9eb; color: #333; border-bottom-left-radius: 2px; }

        .input-row { display: flex; gap: 10px; align-items: center; }
        .chat-input { flex: 1; padding: 12px; border: 1px solid #ccc; border-radius: 4px; }
        .send-btn { width: auto; padding: 12px 25px; background: #0056b3; color: white; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; }

        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 12px; border-bottom: 1px solid #eee; text-align: left; }
        th { background: #f8f9fa; color: #666; font-size: 13px; }
        .status-badge {
            background: #28a745;
            color: white;
            padding: 3px 8px;
            border-radius: 10px;
            font-size: 11px;
            text-transform: uppercase;
        }

        .resolve-btn {
            background: #ffc107;
            color: #333;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            font-size: 12px;
        }
        .resolve-btn:hover { background: #e0a800; }

        .error-msg { color: #d9534f; font-size: 14px; margin-top: 10px; display: none; }
        .error-msg.show { display: block; }
    </style>
</head>
<body>

<div class="container">
    <div id="auth-screen">
        <h1>TSI Helpdesk</h1>
        <div class="auth-tabs">
            <button class="tab-btn active" id="login-tab-btn" onclick="switchAuthTab('login')">Login</button>
            <button class="tab-btn" id="reg-tab-btn" onclick="switchAuthTab('register')">Register</button>
        </div>

        <div id="panel-login" class="form-panel">
            <div class="form-group"><label>Username</label><input type="text" id="login-username"></div>
            <div class="form-group"><label>Password</label><input type="password" id="login-password"></div>
            <button class="submit-btn" onclick="doLogin()">Sign In</button>
        </div>

        <div id="panel-register" class="form-panel" style="display:none;">
            <div class="form-group"><label>First Name</label><input type="text" id="reg-firstname"></div>
            <div class="form-group"><label>Last Name</label><input type="text" id="reg-lastname"></div>
            <div class="form-group"><label>Email</label><input type="email" id="reg-email"></div>
            <div class="form-group"><label>Username</label><input type="text" id="reg-username"></div>
            <div class="form-group"><label>Password</label><input type="password" id="reg-password"></div>
            <button class="submit-btn" onclick="doRegister()">Create Account</button>
        </div>
        <div id="auth-error" class="error-msg"></div>
    </div>

    <div id="main-app" style="display:none;">
        <div class="chat-topbar">
            <strong>Welcome, <span id="username-badge"></span></strong>
            <a href="#" onclick="doLogout()" style="color: #d9534f; text-decoration: none; font-size: 14px;">Logout</a>
        </div>

        <div class="main-tabs">
            <button id="tab-chat-btn" class="tab-btn active" onclick="showSection('chat')">Chat</button>
            <button id="tab-tickets-btn" class="tab-btn" onclick="showSection('tickets')">My Tickets</button>
            <button id="tab-tracker-btn" class="tab-btn" onclick="showSection('tracker')" style="display: none;">All Tickets</button>
        </div>

        <div id="chat-section">
            <div class="messages-area" id="messages"></div>
            <div class="input-row">
                <input class="chat-input" type="text" id="chat-input" placeholder="Type your question..." onkeydown="if(event.key==='Enter')sendMsg()">
                <button class="send-btn" id="send-btn" onclick="sendMsg()">Send</button>
            </div>
        </div>

        <div id="tickets-section" style="display:none;">
            <table id="tickets-table">
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Title</th>
                    <th>Category</th>
                    <th>Status</th>
                </tr>
                </thead>
                <tbody id="tickets-body">
                </tbody>
            </table>
        </div>

        <div id="tracker-section" style="display:none;">
            <table>
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Title</th>
                    <th>Status</th>
                    <th>Action</th>
                </tr>
                </thead>
                <tbody id="tracker-body">
                </tbody>
            </table>
        </div>

    </div>
</div>

<script>
    const BASE = 'http://localhost:8080';
    let token = localStorage.getItem('token');
    let username = localStorage.getItem('username');

    if (token) showMainApp();

    // НОВОЕ: Функция для парсинга и декодирования JWT токена на фронтенде
    function parseJwt(token) {
        try {
            const base64Url = token.split('.')[1];
            const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
            const jsonPayload = decodeURIComponent(window.atob(base64).split('').map(function(c) {
                return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
            }).join(''));
            return JSON.parse(jsonPayload);
        } catch (e) {
            return null;
        }
    }

    function switchAuthTab(tab) {
        document.getElementById('panel-login').style.display = tab === 'login' ? 'block' : 'none';
        document.getElementById('panel-register').style.display = tab === 'register' ? 'block' : 'none';
        document.getElementById('login-tab-btn').classList.toggle('active', tab === 'login');
        document.getElementById('reg-tab-btn').classList.toggle('active', tab === 'register');
    }

    function showSection(section) {
        document.getElementById('chat-section').style.display = section === 'chat' ? 'block' : 'none';
        document.getElementById('tickets-section').style.display = section === 'tickets' ? 'block' : 'none';
        document.getElementById('tracker-section').style.display = section === 'tracker' ? 'block' : 'none';

        document.getElementById('tab-chat-btn').classList.toggle('active', section === 'chat');
        document.getElementById('tab-tickets-btn').classList.toggle('active', section === 'tickets');
        document.getElementById('tab-tracker-btn').classList.toggle('active', section === 'tracker');

        if (section === 'tickets') loadTickets();
        if (section === 'tracker') loadAllTickets();
    }

    async function doLogin() {
        const u = document.getElementById('login-username').value;
        const p = document.getElementById('login-password').value;
        try {
            const r = await fetch(`${BASE}/api/auth/login`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username: u, password: p })
            });
            if (!r.ok) throw new Error('Invalid credentials');
            token = await r.text();
            username = u;
            localStorage.setItem('token', token);
            localStorage.setItem('username', username);
            showMainApp();
        } catch(e) { alert(e.message); }
    }

    async function doRegister() {
        const firstName = document.getElementById('reg-firstname').value.trim();
        const lastName = document.getElementById('reg-lastname').value.trim();
        const email = document.getElementById('reg-email').value.trim();
        const u = document.getElementById('reg-username').value.trim();
        const p = document.getElementById('reg-password').value.trim();

        // Базовая валидация на фронте
        if (!firstName || !lastName || !email || !u || !p) {
            alert('All fields are required!');
            return;
        }

        try {
            const r = await fetch(`${BASE}/api/auth/register`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    firstName: firstName,
                    lastName: lastName,
                    email: email,
                    username: u,
                    password: p
                })
            });

            if (!r.ok) throw new Error('Registration failed. Check your data.');

            alert('Registration successful! Now you can sign in.');

            // Переключаемся на логин и чистим поля
            switchAuthTab('login');
            document.getElementById('reg-firstname').value = '';
            document.getElementById('reg-lastname').value = '';
            document.getElementById('reg-email').value = '';
            document.getElementById('reg-username').value = '';
            document.getElementById('reg-password').value = '';

        } catch(e) {
            alert(e.message);
        }
    }

    async function loadTickets() {
        const tbody = document.getElementById('tickets-body');
        tbody.innerHTML = '<tr><td colspan="4">Loading...</td></tr>';
        try {
            const r = await fetch(`${BASE}/api/ticket/get`, {
                headers: { 'Authorization': `Bearer ${token}` }
            });
            const tickets = await r.json();
            tbody.innerHTML = tickets.map(t => `
                <tr>
                    <td>#${t.id}</td>
                    <td>${t.title}</td>
                    <td>${t.category}</td>
                    <td><span class="status-badge">${t.status}</span></td>
                </tr>
            `).join('') || '<tr><td colspan="4">No tickets yet</td></tr>';
        } catch(e) { tbody.innerHTML = '<tr><td colspan="4">Error loading data</td></tr>'; }
    }

    async function loadAllTickets() {
        const tbody = document.getElementById('tracker-body');
        tbody.innerHTML = '<tr><td colspan="4">Loading...</td></tr>';
        try {
            const r = await fetch(`${BASE}/api/ticket-tracker`, {
                headers: { 'Authorization': `Bearer ${token}` }
            });

            if (!r.ok) throw new Error('Failed to fetch');
            const tickets = await r.json();

            tbody.innerHTML = tickets.map(t => `
                <tr>
                    <td>#${t.id}</td>
                    <td>${t.title || 'No Title'}</td>
                    <td><span class="status-badge" style="${t.status === 'RESOLVED' ? 'background: #6c757d;' : ''}">${t.status || 'ACTIVE'}</span></td>
                    <td>
                        ${t.status !== 'RESOLVED'
                ? `<button class="resolve-btn" onclick="resolveTicket(${t.id})">Resolve</button>`
                : '<span>-</span>'}
                    </td>
                </tr>
            `).join('') || '<tr><td colspan="4">No tickets found</td></tr>';
        } catch(e) { tbody.innerHTML = '<tr><td colspan="4">Error loading data</td></tr>'; }
    }

    async function resolveTicket(id) {
        if (!confirm(`Are you sure you want to resolve ticket #${id}?`)) return;

        try {
            const r = await fetch(`${BASE}/api/ticket-tracker/resolve?id=${id}`, {
                method: 'POST',
                headers: { 'Authorization': `Bearer ${token}` }
            });

            if (r.ok) {
                alert(`Ticket #${id} has been resolved!`);
                loadAllTickets();
            } else {
                alert('Failed to resolve the ticket.');
            }
        } catch(e) {
            alert('Error: Connection lost.');
        }
    }

    // МОДИФИЦИРОВАНО: Проверка роли при инициализации интерфейса приложения
    function showMainApp() {
        document.getElementById('auth-screen').style.display = 'none';
        document.getElementById('main-app').style.display = 'block';
        document.getElementById('username-badge').textContent = username;

        // Расшифровываем токен и смотрим, что внутри массива "roles"
        const tokenData = parseJwt(token);
        const userRoles = tokenData ? (tokenData.roles || tokenData.authorities || []) : [];

        // Если у пользователя есть роль ROLE_ADMIN — показываем вкладку трекера
        if (userRoles.includes('ROLE_ADMIN')) {
            document.getElementById('tab-tracker-btn').style.display = 'inline-block';
        } else {
            document.getElementById('tab-tracker-btn').style.display = 'none';
        }

        appendMsg('bot', `Hello ${username}! How can I help you today?`);
    }

    function doLogout() {
        localStorage.clear();
        location.reload();
    }

    function appendMsg(role, text, isTyping = false) {
        const msgs = document.getElementById('messages');
        const wrap = document.createElement('div');
        wrap.className = `msg ${role}`;
        const bubble = document.createElement('div');
        bubble.className = 'msg-bubble';

        if (isTyping) bubble.innerHTML = '<i>Thinking...</i>';
        else if (role === 'bot') bubble.innerHTML = marked.parse(text);
        else bubble.textContent = text;

        wrap.appendChild(bubble);
        msgs.appendChild(wrap);
        msgs.scrollTop = msgs.scrollHeight;
        return wrap;
    }

    async function sendMsg() {
        const input = document.getElementById('chat-input');
        const q = input.value.trim();
        if (!q) return;
        input.value = '';
        appendMsg('user', q);
        const typing = appendMsg('bot', '', true);
        try {
            const r = await fetch(`${BASE}/api/chat/ask`, {
                method: 'POST',
                headers: {
                    'Authorization': `Bearer ${token}`,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ question: q })
            });
            const text = await r.text();
            typing.remove();
            appendMsg('bot', text);
        } catch(e) {
            typing.remove();
            appendMsg('bot', 'Error: Connection lost.');
        }
    }
</script>
</body>
</html>
